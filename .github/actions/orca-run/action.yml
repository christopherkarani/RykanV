name: ryk Run
description: Run a repository command through local ryk in CI without hosted services.
inputs:
  command:
    description: Command to execute after `ryk run --mode ci --`.
    required: true
  policy:
    description: Optional policy path.
    required: false
    default: .orca/policy.yaml
runs:
  using: composite
  steps:
    - name: Check ryk policy
      shell: bash
      env:
        ORCA_ACTION_POLICY: ${{ inputs.policy }}
      run: |
        if [ -f "$ORCA_ACTION_POLICY" ]; then
          ryk policy check "$ORCA_ACTION_POLICY"
        else
          echo "ryk policy not found at $ORCA_ACTION_POLICY; initialize one with 'ryk init --preset github-actions'." >&2
          exit 1
        fi
    - name: Run command through ryk
      shell: bash
      env:
        ORCA_ACTION_COMMAND: ${{ inputs.command }}
      run: |
        ryk run --mode ci -- bash -c "$ORCA_ACTION_COMMAND"
