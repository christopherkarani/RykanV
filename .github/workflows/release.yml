name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
      signing_enabled:
        description: Run optional signing hook
        required: true
        default: "0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RYK_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RYK_POSTHOG_PROJECT_TOKEN: ${{ secrets.RYK_POSTHOG_PROJECT_TOKEN }}
      RYK_RELEASE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION_INPUT#v}"
          case "$version" in
            ''|*[!0-9.]*|*.*.*.*) echo "::error::invalid release version: $RELEASE_VERSION_INPUT" >&2; exit 1 ;;
          esac
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release version must be X.Y.Z: $RELEASE_VERSION_INPUT" >&2
            exit 1
          fi
          source_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$source_version" ]; then
            echo "::error::release version $version does not match VERSION $source_version" >&2
            exit 1
          fi
          echo "RYK_VERSION=$version" >> "$GITHUB_ENV"

      # Mac cut-release (scripts/cut-release.sh) is the primary publisher. When a
      # v* tag is pushed after assets already exist (checksums.txt and the
      # telemetry contract on the release),
      # skip the full CI rebuild so we do not double-upload or race the Mac cutter.
      # workflow_dispatch remains a manual backup path and always runs.
      - name: Resolve skip flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VER="${RYK_VERSION#v}"
          echo "RYK_VERSION=${VER}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "SKIP_RELEASE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if gh release view "v${VER}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Require the complete five-target inventory before skipping. A
            # partial release must not green-path the build on a tag race.
            assets="$(gh release view "v${VER}" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' 2>/dev/null || true)"
            has_checksums=0
            has_telemetry_contract=0
            has_telemetry_enabled=0
            has_sbom=0
            has_darwin_amd64=0
            has_darwin_arm64=0
            has_linux_amd64=0
            has_linux_arm64=0
            has_windows_amd64=0
            has_homebrew=0
            has_npm=0
            has_scoop=0
            has_winget=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$name" in
                checksums.txt) has_checksums=1 ;;
                telemetry-contract.txt) has_telemetry_contract=1 ;;
                sbom.json) has_sbom=1 ;;
                "ryk-v${VER}-darwin-amd64.tar.gz") has_darwin_amd64=1 ;;
                "ryk-v${VER}-darwin-arm64.tar.gz") has_darwin_arm64=1 ;;
                "ryk-v${VER}-linux-amd64.tar.gz") has_linux_amd64=1 ;;
                "ryk-v${VER}-linux-arm64.tar.gz") has_linux_arm64=1 ;;
                "ryk-v${VER}-windows-amd64.zip") has_windows_amd64=1 ;;
                ryk.rb) has_homebrew=1 ;;
                package.json) has_npm=1 ;;
                ryk.json) has_scoop=1 ;;
                ryk.yaml) has_winget=1 ;;
              esac
            done <<< "$assets"
            if [ "$has_telemetry_contract" = 1 ]; then
              contract_dir="$(mktemp -d)"
              if gh release download "v${VER}" --repo "$GITHUB_REPOSITORY" \
                --pattern telemetry-contract.txt --dir "$contract_dir" >/dev/null 2>&1 && \
                grep -qx 'transport=enabled' "$contract_dir/telemetry-contract.txt"; then
                has_telemetry_enabled=1
              fi
              rm -rf "$contract_dir"
            fi
            if [ "$has_checksums" = 1 ] && [ "$has_telemetry_contract" = 1 ] && [ "$has_telemetry_enabled" = 1 ] && [ "$has_sbom" = 1 ] && \
              [ "$has_darwin_amd64" = 1 ] && [ "$has_darwin_arm64" = 1 ] && \
              [ "$has_linux_amd64" = 1 ] && [ "$has_linux_arm64" = 1 ] && \
              [ "$has_windows_amd64" = 1 ] && [ "$has_homebrew" = 1 ] && \
              [ "$has_npm" = 1 ] && [ "$has_scoop" = 1 ] && [ "$has_winget" = 1 ]; then
              echo "Release v${VER} has all five CLI artifacts, checksums.txt, telemetry-contract.txt, sbom.json, and package manifests; skipping CI release job (Mac cut-release primary)."
              echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Release v${VER} incomplete (checksums=${has_checksums} telemetry_contract=${has_telemetry_contract} telemetry_enabled=${has_telemetry_enabled} darwin_amd64=${has_darwin_amd64} darwin_arm64=${has_darwin_arm64} linux_amd64=${has_linux_amd64} linux_arm64=${has_linux_arm64} windows_amd64=${has_windows_amd64} sbom=${has_sbom} homebrew=${has_homebrew} npm=${has_npm} scoop=${has_scoop} winget=${has_winget}); running CI release."
          fi
          echo "SKIP_RELEASE=0" >> "$GITHUB_ENV"

      - name: Early exit when skipped
        if: env.SKIP_RELEASE == '1'
        run: 'echo "No-op: assets already published for this tag."'

      - uses: mlugg/setup-zig@v2
        if: env.SKIP_RELEASE != '1'
        with:
          version: 0.16.0
      # PCRE2 is Zig-built from source for each -Dtarget in build-release.sh; no host libpcre2-dev.
      - name: Normalize version metadata
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          echo "RYK_COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "RYK_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Setup Node.js
        if: env.SKIP_RELEASE != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: npm
          cache-dependency-path: ryk-dashboard-ui/package-lock.json
      - name: Build Next.js dashboard
        if: env.SKIP_RELEASE != '1'
        shell: bash
        working-directory: ryk-dashboard-ui
        run: |
          npm ci
          npm run build
      - name: Verify dashboard build
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          if [ ! -f "ryk-dashboard-ui/dist/index.html" ]; then
            echo "::error::Dashboard build did not produce ryk-dashboard-ui/dist/index.html"
            exit 1
          fi
          if ! grep -q 'class="[^"]*dark[^"]*"' ryk-dashboard-ui/dist/index.html; then
            echo "::error::Dashboard build output is not the dark Next.js dashboard (missing dark class on <html>)"
            exit 1
          fi
          echo "Dashboard build verified: dark Next.js dashboard present with _next/static/ output."
      - name: Test before release
        if: env.SKIP_RELEASE != '1'
        run: ./scripts/zig build test
      - name: Red-team CI
        if: env.SKIP_RELEASE != '1'
        run: |
          ./scripts/zig build -Dversion="$RYK_VERSION" -Dcommit="$RYK_COMMIT" -Dbuild-date="$RYK_BUILD_DATE"
          ./zig-out/bin/ryk redteam --ci
      - name: Build release artifacts
        if: env.SKIP_RELEASE != '1'
        shell: bash
        env:
          RYK_SIGNING_ENABLED: ${{ github.event.inputs.signing_enabled || '0' }}
          RYK_SIGNING_COMMAND: ${{ secrets.RYK_SIGNING_COMMAND }}
        run: RYK_VERSION="$RYK_VERSION" RYK_COMMIT="$RYK_COMMIT" RYK_BUILD_DATE="$RYK_BUILD_DATE" ./scripts/build-release.sh
      - name: Package plugins
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: ./scripts/package-plugins.sh
      - name: Verify plugin artifacts
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          ls -la dist/plugins/
          cat dist/plugins/ryk-plugin-checksums.txt
      - name: Verify plugin checksums
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          cd dist/plugins && shasum -a 256 -c ryk-plugin-checksums.txt
      - name: Secret scan over plugin artifacts
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          SCAN_ISSUES=0
          for file in dist/plugins/*.zip; do
            [ -f "$file" ] || continue
            tmpdir="$(mktemp -d)"
            unzip -q "$file" -d "$tmpdir"
            if grep -riE "(api_key|apikey|secret|token|password|private_key|privkey)[[:space:]]*[:=][[:space:]]*[\"']?[a-zA-Z0-9_/-]{16,}" "$tmpdir" 2>/dev/null | grep -v "fake_" | grep -v "example" | grep -v "placeholder" | grep -v "your_"; then
              echo "WARNING: Potential secret pattern in $file" >&2
              SCAN_ISSUES=$((SCAN_ISSUES + 1))
            fi
            rm -rf "$tmpdir"
          done
          if [ "$SCAN_ISSUES" -gt 0 ]; then
            echo "Secret scan found $SCAN_ISSUES potential issues. Review artifacts before release." >&2
            exit 1
          fi
          echo "Secret scan passed."
      - name: Verify checksums
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          ./scripts/verify-release.sh dist
      - name: Installed layout smoke
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: RYK_DIST_DIR=dist ./scripts/install-layout-smoke-test.sh
      - name: Ensure SBOM hook output exists
        if: env.SKIP_RELEASE != '1'
        run: test -s dist/sbom.json
      - name: Upload release artifacts
        if: env.SKIP_RELEASE != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ryk-release-${{ env.RYK_VERSION }}
          path: |
            dist/ryk-v*.tar.gz
            dist/ryk-v*.zip
            dist/checksums.txt
            dist/telemetry-contract.txt
            dist/sbom.json
            dist/release-manifest.json
            dist/package-manifests/**
            dist/plugins/*.zip
            dist/plugins/ryk-plugin-checksums.txt

      # Attach all dist/ assets (including checksums.txt) to the GitHub Release.
      # Without this step the artifacts only land in the workflow run and never
      # reach the release page, so install.sh's checksum download 404s.
      # Hard-gate on checksums.txt so a release can never publish without it.
      - name: Attach assets to GitHub Release
        if: env.SKIP_RELEASE != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -s dist/checksums.txt || {
            echo "::error::dist/checksums.txt is missing or empty; refusing to publish release without checksums"
            exit 1
          }
          gh release create "v${RYK_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ryk v${RYK_VERSION}" \
            --verify-tag \
            --generate-notes || true
          shopt -s nullglob
          assets=(
            dist/ryk-v*.tar.gz
            dist/ryk-v*.zip
            dist/checksums.txt
            dist/telemetry-contract.txt
            dist/sbom.json
            dist/release-manifest.json
            dist/package-manifests/homebrew/Formula/ryk.rb
            dist/package-manifests/npm/package.json
            dist/package-manifests/scoop/ryk.json
            dist/package-manifests/winget/ryk.yaml
            dist/plugins/*.zip
            dist/plugins/ryk-plugin-checksums.txt
          )
          gh release upload "v${RYK_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${assets[@]}"
