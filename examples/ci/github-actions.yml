name: ryk
on:
  push:
  pull_request:

jobs:
  ryk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Red-team
        run: ./zig-out/bin/ryk redteam --ci --json > ryk-redteam.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ryk-artifacts
          path: |
            .ryk/**
            ryk-redteam.json
