<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">ryk architecture</title>
  <desc id="desc">Agent hosts enter the ryk launch and adapter layer, then pass through policy and safety packs before reaching guarded effects and local evidence.</desc>
