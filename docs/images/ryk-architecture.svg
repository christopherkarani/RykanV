    <text x="484" y="242" text-anchor="middle" fill="#d9e5f2" font-size="16" font-weight="500">host hooks</text>
    <text x="484" y="270" text-anchor="middle" fill="#d9e5f2" font-size="16" font-weight="500">tool events</text>
