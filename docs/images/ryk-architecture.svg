<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">ryk architecture</title>
  <desc id="desc">Five coding-agent hosts enter ryk, pass through local policy, reach guarded effects, and produce local evidence.</desc>
  <rect width="1600" height="640" rx="24" fill="#050505"/>

  <g font-family="Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g fill="#a1a1aa" font-size="16" font-weight="600" letter-spacing="3">
      <text x="170" y="66" text-anchor="middle">HOSTS</text>
      <text x="480" y="66" text-anchor="middle">RYK LAUNCH</text>
      <text x="790" y="66" text-anchor="middle">POLICY</text>
      <text x="1100" y="66" text-anchor="middle">GUARDED EFFECTS</text>
      <text x="1410" y="66" text-anchor="middle">EVIDENCE</text>
    </g>

    <g fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2">
      <rect x="64" y="112" width="212" height="56" rx="12"/>
      <rect x="64" y="188" width="212" height="56" rx="12"/>
      <rect x="64" y="264" width="212" height="56" rx="12"/>
      <rect x="64" y="340" width="212" height="56" rx="12"/>
      <rect x="64" y="416" width="212" height="56" rx="12"/>

      <rect x="370" y="196" width="220" height="244" rx="16" stroke="#ededed"/>
      <rect x="680" y="170" width="220" height="292" rx="16" stroke="#ededed"/>
      <rect x="990" y="196" width="220" height="244" rx="16" stroke="#ededed"/>
      <rect x="1300" y="196" width="220" height="244" rx="16" stroke="#ededed"/>
    </g>

    <g fill="#f5f5f5" font-size="20" font-weight="600" text-anchor="middle">
      <text x="170" y="147">Pi</text>
      <text x="170" y="223">Hermes</text>
      <text x="170" y="299">OpenCode</text>
      <text x="170" y="375">Codex</text>
      <text x="170" y="451">Claude</text>
    </g>

    <g font-size="19" text-anchor="middle">
      <text x="480" y="282" fill="#ededed" font-weight="600">ryk &lt;agent&gt;</text>
      <text x="480" y="326" fill="#d4d4d8">session boundary</text>
      <text x="480" y="362" fill="#d4d4d8">host hooks</text>
      <text x="480" y="398" fill="#d4d4d8">tool events</text>

      <text x="790" y="254" fill="#ededed" font-weight="600">local policy</text>
      <text x="790" y="298" fill="#d4d4d8">rules + mode</text>
      <text x="790" y="336" fill="#d4d4d8">86 safety packs</text>
      <text x="790" y="390" fill="#f5f5f5" font-weight="600">allow · ask · deny</text>

      <text x="1100" y="282" fill="#ededed" font-weight="600">commands</text>
      <text x="1100" y="326" fill="#d4d4d8">files · env</text>
      <text x="1100" y="370" fill="#d4d4d8">network · tools</text>

      <text x="1410" y="282" fill="#ededed" font-weight="600">audit</text>
      <text x="1410" y="326" fill="#d4d4d8">replay</text>
      <text x="1410" y="370" fill="#d4d4d8">dashboard</text>
    </g>
  </g>

  <g fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 140H330M276 216H330M276 292H330M276 368H330M276 444H330"/>
    <path d="M330 140V444M330 318H370"/>
    <path d="M590 318H680"/>
    <path d="M900 318H990"/>
    <path d="M1210 318H1300"/>
  </g>

  <g fill="#ededed">
    <circle cx="330" cy="318" r="6"/>
    <circle cx="370" cy="318" r="6"/>
    <circle cx="680" cy="318" r="6"/>
    <circle cx="990" cy="318" r="6"/>
    <circle cx="1300" cy="318" r="6"/>
  </g>
</svg>
