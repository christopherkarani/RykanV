    <text x="708" y="56" fill="#8fa5bd" font-size="16" font-weight="700" letter-spacing="2">POLICY PATH</text>
    <text x="1056" y="56" fill="#8fa5bd" font-size="16" font-weight="700" letter-spacing="2">GUARDED EFFECTS</text>
    <text x="1308" y="56" fill="#8fa5bd" font-size="16" font-weight="700" letter-spacing="2">EVIDENCE</text>
  </g>
